name: Build

# 触发方式：
#   - 推送 v* 标签（如 v0.1.0）→ 构建并在末尾发布 GitHub Release
#   - 手动 workflow_dispatch → 仅构建并把安装包作为 Action artifacts 上传
# 如需「每次推送到 main 都跑」，在 on 下加：
#   push:
#     branches: [main]
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest 为 Apple Silicon（arm64）；如需 Intel(x64) 的 mac 安装包，
        # 可额外加一行 macos-13 到矩阵中（注意其已进入弃用周期）。
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    env:
      # 显式使用官方源，避免本地 .npmrc 的镜像配置（如 npmmirror）影响海外 CI runner 的速度与稳定性。
      npm_config_registry: https://registry.npmjs.org/
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
      # 未提供签名证书时跳过签名，避免 mac 构建因找不到身份而失败。
      # 接入 macOS 签名/公证：删除此变量，并在仓库 secrets 配置
      # CSC_LINK / CSC_KEY_PASSWORD（以及公证用的 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID）。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (electron-vite)
        run: npm run build -w apps/desktop

      - name: Package installers (electron-builder)
        working-directory: apps/desktop
        run: npx electron-builder --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: avero-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
